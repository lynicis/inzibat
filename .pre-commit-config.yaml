default_install_hook_types: [pre-commit, post-commit, post-checkout, post-merge]

repos:
  - repo: local
    hooks:
      - id: graphify-update
        name: graphify-update
        entry: graphify update .
        language: system
        stages: [post-commit, post-merge, post-checkout]
        always_run: true
        pass_filenames: false
